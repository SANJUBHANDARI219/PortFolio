<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PortFolio</title>
    <!-- include css -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css">
</head>
    <body>
        <div class="main-container">
            <header>
                <!-- left side brand name show -->
                <div class="brand-info">
                    <img src="logo.png" alt="">
                    <h2>Sanju Bhandari</h2>
                </div>

                <!-- manu bar for mobile -->
                <div class="menu-area">
                    <input type="checkbox" name="" id="menu-toggle" hidden />

                    <!-- when open -->
                    <label for="menu-toggle" class="menu-icon"><i class="bx bx-menu"></i></label>

                    <!-- when close -->
                    <label for="menu-toggle" id="overlay"></label>

                    <!-- navigation bar -->
                    <nav>
                        <a href="#" style="--i:1">Home</a>
                        <a href="#" style="--i:2">About</a>
                        <a href="#" style="--i:3">Services</a>
                        <a href="#" style="--i:4">Project</a>
                        <a href="#" style="--i:5">Contact</a>
                    </nav>
                </div>
            </header>

            <!-- main body -->
            <main>Main Section</main>
        </div>

        <!-- input javascript -->
        <script src="script.js" defer></script>
    </body>
</html>
